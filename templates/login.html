<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unimed SSParaíso — Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
</head>

<body>

    <main class="login-page">
        <section class="login-card fade-up">
            <div class="login-brand">
                <img class="login-brand-logo" src="{{ url_for('static', filename='img/logo_unimed_ssp.png') }}"
                    alt="Unimed São Sebastião do Paraíso" />
            </div>

            <div class="login-card-header">
                <p class="login-eyebrow">Formulários de adesão</p>
                <h1 class="login-title">Acesse sua <em>conta</em></h1>
                <p class="login-desc">Acesse com suas credenciais.</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="login_usuario" class="form-label required">Usuário</label>
                    <input id="login_usuario" class="input" name="usuario" type="text"
                        placeholder="Digite seu usuário" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="login_senha" class="form-label required">Senha</label>
                    <div class="login-password-wrapper">
                        <input id="login_senha" class="input" name="senha" type="password"
                            placeholder="Digite sua senha" autocomplete="current-password" required>
                        <button type="button" class="login-password-toggle" id="btnToggleSenha"
                            aria-label="Mostrar senha" aria-pressed="false">
                            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                                <path d="M1.5 9S4.2 3.5 9 3.5 16.5 9 16.5 9 13.8 14.5 9 14.5 1.5 9 1.5 9z"
                                    stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
                                    stroke-linejoin="round" />
                                <circle cx="9" cy="9" r="2.4" stroke="currentColor" stroke-width="1.4" />
                            </svg>
                        </button>
                    </div>
                </div>

                <span class="form-error" id="loginError">Usuário ou senha inválidos.</span>

                <button class="btn btn--primary login-submit" type="submit">
                    Entrar
                </button>
            </form>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>

</html>
